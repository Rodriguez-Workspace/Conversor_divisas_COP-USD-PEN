# Fly.io Configuration (Always-On: auto_stop_machines = "off")
app = "currency-pwa"
primary_region = "mia" # Miami (baja latencia para Colombia y Perú)

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"      # NUNCA se duerme
  auto_start_machines = true
  min_machines_running = 1        # Mantiene siempre al menos 1 máquina activa 24/7

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
