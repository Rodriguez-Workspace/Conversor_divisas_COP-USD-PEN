<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6" />

  <!-- Central Dynamic Exchange Circle -->
  <g filter="url(#shadow)">
    <!-- Outer ring -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="10 8" />

    <!-- Top Arrow Arc (COP -> USD -> PEN) -->
    <path d="M 176 160 A 120 120 0 0 1 336 160" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" />
    <polygon points="346,160 330,144 330,176" fill="#10b981" />

    <!-- Bottom Arrow Arc -->
    <path d="M 336 352 A 120 120 0 0 1 176 352" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" />
    <polygon points="166,352 182,336 182,368" fill="#f59e0b" />

    <!-- Center Hub -->
    <circle cx="256" cy="256" r="68" fill="#0f172a" stroke="#475569" stroke-width="4" />
    
    <!-- Exchange glyph / Currency symbol -->
    <text x="256" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#f8fafc" text-anchor="middle">$</text>
  </g>

  <!-- Currency Pills -->
  <!-- COP (Top Left) -->
  <g transform="translate(90, 110)">
    <rect width="84" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <text x="42" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="middle">COP</text>
  </g>

  <!-- USD (Top Right) -->
  <g transform="translate(338, 110)">
    <rect width="84" height="34" rx="17" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="42" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#10b981" text-anchor="middle">USD</text>
  </g>

  <!-- PEN (Bottom Center) -->
  <g transform="translate(214, 396)">
    <rect width="84" height="34" rx="17" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text x="42" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#f59e0b" text-anchor="middle">PEN</text>
  </g>
</svg>
