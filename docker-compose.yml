version: '3.8'

services:
  app:
    build: .
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CACHE_TTL_SECONDS=3600
    expose:
      - "3000"
    networks:
      - webnet

  # Reverse Proxy con SSL automático Let's Encrypt (opcional si tienes dominio)
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - webnet
    depends_on:
      - app

networks:
  webnet:

volumes:
  caddy_data:
  caddy_config:
